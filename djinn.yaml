driver:
  name: acp
  model: cursor/sonnet-4
mode: agent
session:
  max_turns: 30
  auto_approve: false
  output_mode: streaming
  no_persist: false
sandbox:
  backend: ""
  level: namespace
debug:
  tap_file: /tmp/djinn-frames.jsonl
  live_debug: "127.0.0.1:9999"
  verbose: false

# MCP server configuration (TSK-552: Scribe as first MCP).
# "mcp_servers" is the new Configurable key; "mcp" is legacy.
mcp_servers:
  scribe:
    command: "scribe"
    args: ["serve"]
